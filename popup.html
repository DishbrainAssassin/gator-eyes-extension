<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Gator Eyes</title>
<style>
  body { margin: 0; width: 340px; background: #0d0f0c; color: #e6e6e0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #141712; border-bottom: 1px solid #2a2e26; }
  .hd img { width: 22px; height: 22px; border-radius: 50%; }
  .hd b { font-size: 14px; } .hd .sp { flex: 1; }
  .k { color: #9a9f93; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 12px 4px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 12px; border-top: 1px solid #1d201b; white-space: nowrap; }
  td.n { text-align: right; font: 600 12.5px ui-monospace, Menlo, Consolas, monospace; }
  td.n .usd { display: block; color: #9a9f93; font: 500 10.5px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .src { font-size: 10px; color: #c9a227; margin-left: 4px; }
  .up { color: #7ed48a; } .dn { color: #ee7b6d; } .mu { color: #9a9f93; }
  a { color: #c9a227; text-decoration: none; font-weight: 600; } a:hover { text-decoration: underline; }
  .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid #2a2e26; background: #101310; font-size: 12px; color: #9a9f93; }
  .note { padding: 12px; color: #9a9f93; }
  .note b { color: #e6e6e0; }
  [hidden] { display: none !important; }
  .rs { margin-top: 5px; font-size: 11.5px; color: #9a9f93; }
  .rs.err { color: #ee7b6d; } .rs.ok { color: #7ed48a; }
  .rbx { padding: 10px 12px; border-top: 1px solid #2a2e26; }
  .rbx .row { display: flex; align-items: center; gap: 8px; }
  .rbx select, .rbx input { font: 12.5px inherit; font-family: inherit; color: #e6e6e0; background: #0a0c09; border: 1px solid #2a2e26; border-radius: 6px; padding: 5px 6px; }
  .rbx select { flex: 1; } .rbx input { flex: 1; min-width: 0; }
  .rbx button { font: 600 12px inherit; font-family: inherit; border-radius: 6px; padding: 5px 9px; cursor: pointer; border: 1px solid #c9a227; background: #c9a227; color: #0d0f0c; }
  .wl { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
  .wl span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 8px; border-radius: 999px; background: #1a1e17; border: 1px solid #2a2e26; font-size: 12px; }
  .wl button { background: none; border: 0; color: #9a9f93; padding: 0 4px; font-size: 14px; cursor: pointer; }
  .wl button:hover { color: #ee7b6d; }
  .fine { padding: 0 12px 10px; font-size: 11px; color: #7c8176; }
</style></head>
<body>
  <div class="hd"><img src="icons/icon32.png" alt=""><b>Gator Eyes</b><span class="sp"></span><span class="mu" id="tag">free · read-only</span></div>
  <section id="p-movers">
    <div class="k">Most traded, last 24h</div>
    <div id="list"><div class="note">Loading…</div></div>
    <div class="rbx">
      <div class="k" style="padding:0 0 6px">Ribbon on Solada and Snek.fun</div>
      <div class="row"><select id="rbmode" aria-label="What the ribbon shows">
        <option value="trades">Gator Eyes trade feed</option><option value="watch">My watchlist</option><option value="off">Off</option>
      </select></div>
      <div class="k" style="padding:10px 0 0">Watchlist <span class="mu" id="wlct"></span></div>
      <div class="wl" id="wl"></div>
      <form class="row" id="wlimp"><input id="wlurl" placeholder="Paste a gatoreyes.fun watchlist link" aria-label="gatoreyes.fun watchlist link"><button type="submit">Import</button></form>
      <div class="rs" id="wlnote">Star coins with ☆ in the coin panel. Saved in this browser only.</div>
    </div>
    <div class="ft"><a href="https://gatoreyes.fun/" target="_blank" rel="noopener">gatoreyes.fun</a><span id="upd"></span></div>
  </section>

  <script src="popup.js"></script>
</body></html>
